[package]
name = "turso_mysql_runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Unix runtime executable for the Turso MySQL server"

[[bin]]
name = "turso-mysql-server"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
turso_mysql_server.workspace = true

[target.'cfg(unix)'.dependencies]
ctrlc = { version = "3.4.4", features = ["termination"] }
turso_mysql_checkpoint_authority.workspace = true

[dev-dependencies]
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
turso_mysql.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.172"

[lints]
workspace = true
