[package]
name = "turso_mysql_server"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded classic MySQL protocol primitives for Turso"

[lib]
path = "src/lib.rs"

[features]
# Enables environment-selected SIGSTOP hooks for cross-crate crash tests.
# Production builds must leave this feature disabled.
test-support = []

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
mysql_common = { version = "=0.38.2", default-features = false }
getrandom = "=0.4.2"
sha2 = { version = "=0.11.0", default-features = false }
subtle = "=2.6.1"
zeroize = { version = "=1.8.2", features = ["derive"] }
turso_core = { workspace = true, default-features = true, features = ["conn_raw_api"] }
turso_mysql.workspace = true

[target.'cfg(unix)'.dependencies]
errno.workspace = true
libc = "0.2.172"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
